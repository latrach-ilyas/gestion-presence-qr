<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - {{ seance['module'] }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="qr-container">
        <h1>{{ seance['module'] }}</h1>
        <p>Scannez pour valider votre présence</p>
        
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data={{ lien_scan }}" alt="QR Code" class="qr-image">
        
        <br>
        
        <a href="{{ lien_scan }}" class="bouton">
            🧪 Simuler le scan d'un étudiant
        </a>
        
        <br>
        
        <a href="{{ url_for('dashboard') }}" class="bouton-retour">← Fermer et retourner au tableau de bord</a>
    </div>
</body>
</html>
