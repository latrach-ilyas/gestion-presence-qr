<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Professeur | ENSAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="boite-principale">
        
        <header class="entete">
            <div class="brand">
                <div class="logo" aria-hidden="true">QR</div>
                <div class="brand-text">
                    <div class="brand-name">ENSAM</div>
                    <div class="brand-subtitle">Espace Professeur</div>
                </div>
            </div>
        </header>

        <section class="login-section">
            <h1>Connexion</h1>
            <p class="description">Veuillez vous identifier pour accéder à votre tableau de bord.</p>

            {% if erreur %}
                <div class="alerte-erreur">
                    {{ erreur }}
                </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" class="formulaire-login">
                <div class="groupe-input">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" required placeholder="prof@ecole.ma">
                </div>

                <div class="groupe-input">
                    <label for="mot_de_passe">Mot de passe</label>
                    <input type="password" id="mot_de_passe" name="mot_de_passe" required>
                </div>

                <button type="submit" class="bouton bouton-plein">Se connecter</button>
            </form>
        </section>

        <footer class="footer-login">
            <a href="{{ url_for('accueil') }}">← Retour à l'accueil</a>
        </footer>

    </main>
</body>
</html>
